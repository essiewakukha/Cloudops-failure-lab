name: build-push
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-push.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC
  contents: read

env:
  AWS_REGION: us-east-1          # must match terraform/core
  ECR_REPOSITORY: break-fix-lab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t app:ci app

      - name: Smoke test (guardrail - catches broken images before they ship)
        run: |
          docker run -d --name smoke -p 8080:8080 -e APP_MESSAGE=ci app:ci
          for i in $(seq 1 20); do
            curl -fs localhost:8080/healthz && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push (tagged with commit SHA)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker tag app:ci "$IMAGE"
          docker push "$IMAGE"